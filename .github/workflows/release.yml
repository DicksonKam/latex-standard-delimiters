name: Release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate tag and package assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-versions.mjs "$RELEASE_TAG"
          python3 scripts/package-release.py
          sha256sum main.js manifest.json styles.css > SHA256SUMS.txt
          zip "latex-standard-delimiters-$RELEASE_TAG.zip" main.js manifest.json styles.css LICENSE NOTICE.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "$RELEASE_TAG" --notes-file RELEASE-NOTES.md main.js manifest.json styles.css SHA256SUMS.txt "latex-standard-delimiters-$RELEASE_TAG.zip"
